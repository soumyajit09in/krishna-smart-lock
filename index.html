<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Secure Access — Biometric Lock</title>
<script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a10;
    --panel:rgba(19,25,35,0.72);
    --panel-2:rgba(28,37,50,0.85);
    --border:rgba(120,145,175,0.16);
    --border-strong:rgba(120,200,190,0.35);
    --text:#f1f5fa;
    --text-dim:#8492a6;
    --teal:#3fe6cb;
    --teal-2:#7ff7de;
    --amber:#f7b84a;
    --amber-2:#ffd68a;
    --success:#45e08e;
    --danger:#ff5f6d;
    --radius:18px;
    --mx:50%; --my:40%;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'IBM Plex Mono',monospace;
    background:var(--bg);
    color:var(--text);
    min-height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:28px 18px;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- Living background ---------- */
  .aurora{ position:fixed; inset:0; z-index:0; overflow:hidden; }
  .aurora span{
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.35;
    animation:drift 18s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1){ width:420px; height:420px; background:#1ea99a; top:-120px; left:-100px; animation-duration:16s; }
  .aurora span:nth-child(2){ width:380px; height:380px; background:#8a5cff; top:40%; right:-140px; animation-duration:20s; animation-delay:-4s; }
  .aurora span:nth-child(3){ width:340px; height:340px; background:#f7b84a; bottom:-140px; left:20%; animation-duration:22s; animation-delay:-9s; opacity:.22; }
  @keyframes drift{
    0%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,-30px) scale(1.15); }
    100%{ transform:translate(-30px,20px) scale(0.95); }
  }
  .grid-overlay{
    position:fixed; inset:0; z-index:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 42px);
    mask-image:radial-gradient(circle at 50% 30%, black 0%, transparent 75%);
  }
  .spotlight{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(420px circle at var(--mx) var(--my), rgba(63,230,203,0.10), transparent 60%);
    transition:background .05s linear;
  }

  .stage{
    position:relative; z-index:2;
    width:100%; max-width:400px;
    display:flex; flex-direction:column; gap:18px;
    opacity:0; transform:translateY(14px);
    animation:stage-in .8s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  @keyframes stage-in{ to{ opacity:1; transform:translateY(0); } }

  /* ---------- Brand header ---------- */
  .brand{ display:flex; align-items:center; gap:13px; padding:0 2px; }
  .brand-mark{
    width:42px; height:42px; flex:none; border-radius:12px;
    background:linear-gradient(150deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    animation:breathe 3.2s ease-in-out infinite;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:-6px; border-radius:16px;
    border:1px solid var(--border-strong); opacity:0;
    animation:ring-pulse 3.2s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ box-shadow:0 0 0 rgba(63,230,203,0); } 50%{ box-shadow:0 0 18px rgba(63,230,203,0.35); } }
  @keyframes ring-pulse{ 0%{ opacity:.5; transform:scale(1); } 100%{ opacity:0; transform:scale(1.35); } }
  .brand-mark svg{ width:22px; height:22px; color:var(--teal); }
  .brand h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:0; letter-spacing:.2px; }
  .brand p{ margin:2px 0 0; font-size:11.5px; color:var(--text-dim); }

  /* ---------- Status readout ---------- */
  #status{
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px; padding:13px 15px;
    display:flex; align-items:center; gap:10px;
    backdrop-filter:blur(10px);
    transition:background .5s ease, color .5s ease, border-color .5s ease;
  }
  #status::before{
    content:""; width:8px; height:8px; border-radius:50%; flex:none;
    background:var(--text-dim);
    box-shadow:0 0 0 4px rgba(132,146,166,0.15);
    transition:background .4s ease, box-shadow .4s ease;
    animation:idle-pulse 2.4s ease-in-out infinite;
  }
  @keyframes idle-pulse{ 50%{ opacity:.5; } }
  #status.tone-success::before{ background:var(--success); box-shadow:0 0 0 4px rgba(69,224,142,0.22); animation:none; }
  #status.tone-danger::before{ background:var(--danger); box-shadow:0 0 0 4px rgba(255,95,109,0.22); animation:none; }
  #status.tone-active::before{ background:var(--teal); box-shadow:0 0 0 4px rgba(63,230,203,0.22); animation:blink 0.9s ease-in-out infinite; }
  @keyframes blink{ 50%{ opacity:.3; } }

  /* ---------- Viewfinder ---------- */
  .viewfinder{
    position:relative; width:100%; aspect-ratio:3/4;
    border-radius:var(--radius); overflow:hidden;
    background:#03050a;
    border:1px solid var(--border);
    box-shadow:0 30px 60px -24px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.02);
    transition:box-shadow .4s ease, border-color .4s ease;
  }
  .viewfinder:hover{
    border-color:var(--border-strong);
    box-shadow:0 30px 60px -24px rgba(0,0,0,0.75), 0 0 0 4px rgba(63,230,203,0.12);
  }
  .viewfinder:hover .corner{ opacity:1; transform:scale(1.08); }
  #webcam{ width:100%; height:100%; object-fit:cover; display:block; filter:contrast(1.08) saturate(0.92) brightness(0.97); }

  .corner{
    position:absolute; width:28px; height:28px;
    border:2.5px solid var(--teal); opacity:.5;
    transition:opacity .3s ease, transform .3s ease, filter .3s ease;
    transform-origin:center;
  }
  .corner.tl{ top:16px; left:16px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; animation:corner-drop .6s .15s cubic-bezier(.2,.8,.2,1) backwards; }
  .corner.tr{ top:16px; right:16px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; animation:corner-drop .6s .25s cubic-bezier(.2,.8,.2,1) backwards; }
  .corner.bl{ bottom:16px; left:16px; border-right:none; border-top:none; border-radius:0 0 0 8px; animation:corner-drop .6s .25s cubic-bezier(.2,.8,.2,1) backwards; }
  .corner.br{ bottom:16px; right:16px; border-left:none; border-top:none; border-radius:0 0 8px 0; animation:corner-drop .6s .35s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes corner-drop{ from{ opacity:0; transform:scale(0.4); } to{ opacity:.5; transform:scale(1); } }

  .viewfinder.scanning .corner{ opacity:1; animation:corner-pulse 1s ease-in-out infinite; }
  @keyframes corner-pulse{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(63,230,203,0)); transform:scale(1); }
    50%{ filter:drop-shadow(0 0 8px rgba(63,230,203,0.9)); transform:scale(1.06); }
  }

  .scanline{
    position:absolute; left:0; right:0; top:0; height:56px; z-index:2;
    background:linear-gradient(180deg, transparent, rgba(63,230,203,0.28), transparent);
    opacity:.35;
    animation:idle-sweep 4.5s linear infinite;
  }
  .viewfinder.scanning .scanline{
    height:70px; opacity:.95;
    background:linear-gradient(180deg, transparent, rgba(63,230,203,0.6), transparent);
    animation:scan-sweep 1.1s linear infinite;
  }
  @keyframes idle-sweep{ 0%{ transform:translateY(-60px); } 100%{ transform:translateY(700px); } }
  @keyframes scan-sweep{ 0%{ transform:translateY(-70px); } 100%{ transform:translateY(700px); } }

  .viewfinder.grant{ border-color:var(--success); box-shadow:0 0 0 4px rgba(69,224,142,0.22), 0 30px 60px -24px rgba(0,0,0,0.75); }
  .viewfinder.deny{ border-color:var(--danger); box-shadow:0 0 0 4px rgba(255,95,109,0.22), 0 30px 60px -24px rgba(0,0,0,0.75); animation:shake .4s; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }

  .result-icon{
    position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
    background:rgba(3,5,10,0.4); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .result-icon.show{ opacity:1; }
  .result-icon svg{ width:68px; height:68px; }
  .result-icon path, .result-icon polyline, .result-icon line{ stroke-dasharray:60; stroke-dashoffset:60; }
  .result-icon.show path, .result-icon.show polyline, .result-icon.show line{ animation:draw .45s ease-out forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  /* ---------- Controls ---------- */
  .controls{ display:flex; flex-direction:column; gap:11px; }
  .btn{
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px 16px;
    font-family:'Space Grotesk',sans-serif; font-size:15.5px; font-weight:700;
    border:1px solid transparent; border-radius:13px; cursor:pointer;
    color:#06110f;
    background-size:220% 220%; background-position:0% 50%;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, background-position .5s ease, filter .25s ease;
  }
  .btn svg{ width:19px; height:19px; flex:none; transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .btn-finger{ background-image:linear-gradient(120deg,#ffe1a8,var(--amber),#ffd68a,var(--amber)); box-shadow:0 10px 24px -10px rgba(247,184,74,0.55); }
  .btn-face{ background-image:linear-gradient(120deg,#c8fff2,var(--teal),#7ff7de,var(--teal)); box-shadow:0 10px 24px -10px rgba(63,230,203,0.55); }

  .btn::before{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-18deg); transition:left .6s ease;
  }
  .btn:hover::before{ left:130%; }
  .btn:hover{
    transform:translateY(-4px) scale(1.015);
    background-position:100% 50%;
  }
  .btn-finger:hover{ box-shadow:0 16px 34px -12px rgba(247,184,74,0.75); }
  .btn-face:hover{ box-shadow:0 16px 34px -12px rgba(63,230,203,0.75); }
  .btn:hover svg{ transform:scale(1.18) rotate(-6deg); }
  .btn:active{ transform:translateY(-1px) scale(.97); }
  .btn:disabled{
    background-image:none; background-color:var(--panel-2); color:var(--text-dim);
    box-shadow:none; cursor:not-allowed; border-color:var(--border);
  }
  .btn:disabled::before{ display:none; }
  .btn:disabled:hover{ transform:none; }

  .btn .ring{
    position:absolute; border-radius:50%; background:rgba(255,255,255,0.55);
    width:10px; height:10px; opacity:0; pointer-events:none;
    transform:translate(-50%,-50%) scale(1);
  }
  .btn.pulse .ring{ animation:ripple .6s ease-out; }
  @keyframes ripple{ 0%{ opacity:.55; transform:translate(-50%,-50%) scale(1); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(24); } }

  /* ---------- Activity log ---------- */
  .log{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 15px; backdrop-filter:blur(10px); }
  .log h2{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:700; margin:0 0 9px; color:var(--text-dim); }
  .log ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
  .log li{
    display:flex; align-items:baseline; gap:8px;
    font-size:12px; color:var(--text-dim);
    padding:6px 6px; border-radius:7px;
    opacity:0; transform:translateX(-6px);
    animation:log-in .3s ease forwards;
    transition:background .2s ease, transform .2s ease;
  }
  .log li:hover{ background:rgba(255,255,255,0.045); transform:translateX(2px); }
  @keyframes log-in{ to{ opacity:1; transform:translateX(0); } }
  .log li .dot{ width:6px; height:6px; border-radius:50%; flex:none; background:var(--text-dim); }
  .log li.success .dot{ background:var(--success); box-shadow:0 0 6px rgba(69,224,142,0.7); }
  .log li.danger .dot{ background:var(--danger); box-shadow:0 0 6px rgba(255,95,109,0.7); }
  .log li .t{ color:var(--text); flex:1; }
  .log li .time{ color:var(--text-dim); font-size:10.5px; }

  footer.device-id{ text-align:center; font-size:10.5px; color:var(--text-dim); letter-spacing:.3px; opacity:.7; }

  /* ---------- Desktop layout ---------- */
  @media (min-width:900px){
    body{ padding:40px; }
    .stage{
      max-width:860px; display:grid;
      grid-template-columns:380px 1fr;
      grid-template-areas:
        "brand brand"
        "view  log"
        "ctrl  log"
        "foot  log";
      column-gap:24px; row-gap:16px;
    }
    .brand{ grid-area:brand; }
    .viewfinder{ grid-area:view; aspect-ratio:4/5; }
    .controls{ grid-area:ctrl; flex-direction:row; }
    .log{ grid-area:log; align-self:stretch; }
    footer.device-id{ grid-area:foot; text-align:left; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div class="aurora"><span></span><span></span><span></span></div>
  <div class="grid-overlay"></div>
  <div class="spotlight" id="spotlight"></div>

  <div class="stage">

    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5l-8-3Z"/>
          <path d="M9 12.3 11 14.3 15.3 10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Secure Access</h1>
        <p>Face and fingerprint verification</p>
      </div>
    </div>

    <div id="status">Starting recognition engine…</div>

    <div class="viewfinder" id="viewfinder">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanline"></div>
      <video id="webcam" autoplay muted playsinline></video>
      <div class="result-icon" id="resultIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="resultIconSvg">
          <polyline points="4,13 9,18 20,6" stroke="var(--success)"/>
        </svg>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-finger" id="fingerBtn" onclick="verifyFingerprint()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M12 11a4 4 0 0 1 4 4v2"/>
          <path d="M8 15v2a4 4 0 0 0 8 0"/>
          <path d="M6 12a6 6 0 0 1 12 0v3"/>
          <path d="M4 12a8 8 0 0 1 16 0v3"/>
          <path d="M12 11v6"/>
        </svg>
        Use fingerprint
      </button>
      <button class="btn btn-face" id="scanBtn" onclick="verifyFace()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
          <path d="M20 16v2a2 2 0 0 1-2 2h-2"/>
          <path d="M8 20H6a2 2 0 0 1-2-2v-2"/>
          <circle cx="12" cy="11" r="1.4" fill="currentColor" stroke="none"/>
          <path d="M9 15c1 1 5 1 6 0"/>
        </svg>
        Verify my face
      </button>
    </div>

    <div class="log">
      <h2>Recent activity</h2>
      <ul id="logList"></ul>
    </div>

    <footer class="device-id">Device: AI-SMARTLOCK-01</footer>

  </div>

<script>
  const video = document.getElementById('webcam');
  const scanBtn = document.getElementById('scanBtn');
  const fingerBtn = document.getElementById('fingerBtn');
  const statusDiv = document.getElementById('status');
  const viewfinder = document.getElementById('viewfinder');
  const resultIcon = document.getElementById('resultIcon');
  const resultIconSvg = document.getElementById('resultIconSvg');
  const logList = document.getElementById('logList');
  const spotlight = document.getElementById('spotlight');

  // Your API URL
  const APPS_SCRIPT_API = "https://script.google.com/macros/s/AKfycbxfhuZcbCaPGfQ2LFRNVGWujoZcpB_LizeIWaOiHsi_zgcyjXCeDSFeAlYPjz_vzxbP/exec";

  let faceMatcher = null;
  const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/';

  // ---------- cursor spotlight (desktop feel) ----------
  window.addEventListener('pointermove', (e) => {
    spotlight.style.setProperty('--mx', e.clientX + 'px');
    spotlight.style.setProperty('--my', e.clientY + 'px');
  });

  // ==========================================
  // UI HELPERS (visual only — original logic unchanged below)
  // ==========================================
  function setStatus(text, tone){
    statusDiv.innerText = text;
    statusDiv.classList.remove('tone-success','tone-danger','tone-active');
    if (tone) statusDiv.classList.add(tone);
  }

  function showResult(kind){ // 'grant' | 'deny'
    viewfinder.classList.remove('grant','deny','scanning');
    viewfinder.classList.add(kind);
    resultIconSvg.innerHTML = kind === 'grant'
      ? '<polyline points="4,13 9,18 20,6" stroke="var(--success)"/>'
      : '<line x1="6" y1="6" x2="18" y2="18" stroke="var(--danger)"/><line x1="18" y1="6" x2="6" y2="18" stroke="var(--danger)"/>';
    resultIcon.classList.remove('show');
    requestAnimationFrame(() => resultIcon.classList.add('show'));
  }

  function addLogEntry(text, kind){
    const li = document.createElement('li');
    if (kind) li.classList.add(kind);
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    li.innerHTML = `<span class="dot"></span><span class="t">${text}</span><span class="time">${time}</span>`;
    logList.prepend(li);
    while (logList.children.length > 6) logList.removeChild(logList.lastChild);
  }

  function pulseButton(btn){
    const ring = document.createElement('span');
    ring.className = 'ring';
    ring.style.left = '50%';
    ring.style.top = '50%';
    btn.appendChild(ring);
    btn.classList.add('pulse');
    setTimeout(() => { ring.remove(); btn.classList.remove('pulse'); }, 650);
  }

  // ==========================================
  // INITIALIZATION & CAMERA
  // ==========================================
  window.onload = async () => {
    try {
      setStatus("Loading recognition models…", 'tone-active');

      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

      setStatus("Fetching reference photo…", 'tone-active');

      let response = await fetch(`${APPS_SCRIPT_API}?action=getMaster`);
      let data = await response.json();

      if (data.status === "error") {
        setStatus("Reference photo not found", 'tone-danger');
        return;
      }

      const img = new Image();
      img.src = data.image;
      img.onload = async () => {
        const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
        if (!detection) {
          setStatus("No face found in reference photo", 'tone-danger');
          return;
        }
        faceMatcher = new faceapi.FaceMatcher(detection.descriptor, 0.6);
        setStatus("Starting camera…", 'tone-active');
        startCamera();
      };

    } catch (err) {
      setStatus("Initialization failed: " + err, 'tone-danger');
    }
  };

  function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => {
        video.srcObject = stream;
        setStatus("Ready — scan your face or fingerprint");
        scanBtn.disabled = false;
        addLogEntry('System ready');
      })
      .catch(err => {
        setStatus("Camera access denied", 'tone-danger');
      });
  }

  // ==========================================
  // FINGERPRINT LOGIC
  // ==========================================
  async function verifyFingerprint() {
    pulseButton(fingerBtn);

    // WebAuthn runs in a secure context: HTTPS or localhost.
    // Do not open this file directly with file://.
    if (!window.isSecureContext) {
      setStatus("Fingerprint needs HTTPS — open this page over https:// or localhost", 'tone-danger');
      showResult('deny');
      addLogEntry('Blocked: not a secure context', 'danger');
      setTimeout(resetStatus, 5000);
      return;
    }

    if (!window.PublicKeyCredential || !navigator.credentials) {
      setStatus("Fingerprint not supported in this browser", 'tone-danger');
      showResult('deny');
      addLogEntry('Unsupported browser', 'danger');
      setTimeout(resetStatus, 4000);
      return;
    }

    // Common, hard-to-see causes of "SecurityError" even in a secure context:
    // 1) the page is embedded in an iframe (WebAuthn is blocked or needs an
    //    explicit "allow" permission delegated to the iframe)
    // 2) the page is loaded via a raw IP address instead of a real domain
    if (window.top !== window.self) {
      setStatus("Open this page directly in its own tab — it can't run fingerprint inside an embedded frame", 'tone-danger');
      showResult('deny');
      addLogEntry('Blocked: running inside an iframe', 'danger');
      setTimeout(resetStatus, 5500);
      return;
    }
    // Allow WebAuthn on localhost.
    // If this page is opened using a PC's LAN IP (for example 192.168.x.x),
    // automatically switch to localhost when running on the same computer.
    const hostname = window.location.hostname;
    const isLocalhost =
      hostname === "localhost" ||
      hostname === "127.0.0.1" ||
      hostname === "::1";

    const isIPv4 = /^(\d{1,3}\.){3}\d{1,3}$/.test(hostname);

    if (isIPv4 && window.location.protocol === "http:") {
      const localUrl = `${window.location.protocol}//localhost${window.location.port ? ':' + window.location.port : ''}${window.location.pathname}${window.location.search}${window.location.hash}`;
      setStatus("Switching to localhost…", 'tone-active');
      addLogEntry('Switching from IP address to localhost', 'success');
      window.location.replace(localUrl);
      return;
    }

    if (!isLocalhost && window.location.protocol !== "https:") {
      setStatus("Fingerprint requires HTTPS or localhost", 'tone-danger');
      showResult('deny');
      addLogEntry('Fingerprint blocked: use localhost or HTTPS', 'danger');
      setTimeout(resetStatus, 5500);
      return;
    }

    try {
      if (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (!available) {
          setStatus("No fingerprint sensor found on this device", 'tone-danger');
          showResult('deny');
          addLogEntry('No sensor available', 'danger');
          setTimeout(resetStatus, 4500);
          return;
        }
      }
    } catch (checkErr) {
      console.warn("Platform authenticator check failed:", checkErr);
      // Fall through and let the actual create() call surface the real error.
    }

    setStatus("Scanning fingerprint…", 'tone-active');

    try {
      const challengeArray = new Uint8Array(32);
      window.crypto.getRandomValues(challengeArray);

      // Deliberately not setting rp.id — omitting it lets the browser derive
      // it from the page's own origin, which avoids the domain-mismatch
      // SecurityError that a hand-set rp.id can trigger.
      const publicKeyCredentialCreationOptions = {
        challenge: challengeArray,
        rp: { name: "AI Face Lock" },
        user: {
          id: Uint8Array.from("user_admin", c => c.charCodeAt(0)),
          name: "admin",
          displayName: "System Admin"
        },
        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          userVerification: "required"
        },
        timeout: 60000
      };

      const credential = await navigator.credentials.create({
        publicKey: publicKeyCredentialCreationOptions
      });

      if (credential) {
        setStatus("Fingerprint verified — access granted", 'tone-success');
        showResult('grant');
        addLogEntry('Fingerprint verified', 'success');
        await fetch(`${APPS_SCRIPT_API}?action=update&type=unlock`);
        setTimeout(resetStatus, 5000);
      }
    } catch (error) {
      console.error("Fingerprint Error:", error);

      // Map the real WebAuthn error to a clear, specific message instead of
      // always blaming the user's fingerprint.
      let message = "Fingerprint rejected or cancelled";
      if (error.name === 'SecurityError') {
        message = "Blocked by browser security policy — try opening this page in its own top-level tab on a real https:// domain";
      } else if (error.name === 'NotAllowedError') {
        message = "Fingerprint prompt cancelled or timed out";
      } else if (error.name === 'InvalidStateError') {
        message = "A credential already exists for this device";
      } else if (error.name === 'NotSupportedError') {
        message = "This device/browser doesn't support the requested fingerprint options";
      } else if (error.name === 'AbortError') {
        message = "Fingerprint request was aborted";
      }

      setStatus(message, 'tone-danger');
      showResult('deny');
      addLogEntry(message, 'danger');
      
      // 👇 BUZZER TRIGGER API ADDED HERE 👇
      await fetch(`${APPS_SCRIPT_API}?action=update&type=buzzer`);
      
      setTimeout(resetStatus, 5000);
    }
  }

  // ==========================================
  // FACE VERIFY LOGIC
  // ==========================================
  async function verifyFace() {
    if (!faceMatcher) {
      setStatus("Still preparing the reference photo — try again in a moment", 'tone-danger');
      return;
    }

    scanBtn.disabled = true;
    pulseButton(scanBtn);
    viewfinder.classList.remove('grant','deny');
    viewfinder.classList.add('scanning');
    setStatus("Analyzing face…", 'tone-active');

    let liveDetection;
    try {
      liveDetection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
    } catch (err) {
      console.error("Face detection error:", err);
      setStatus("Face detection failed — check camera permissions", 'tone-danger');
      viewfinder.classList.remove('scanning');
      scanBtn.disabled = false;
      return;
    }
    if (!liveDetection) {
      setStatus("Face not detected", 'tone-danger');
      viewfinder.classList.remove('scanning');
      scanBtn.disabled = false;
      return;
    }

    const match = faceMatcher.findBestMatch(liveDetection.descriptor);

    if (match.label !== 'unknown') {
      setStatus("Face verified — access granted", 'tone-success');
      showResult('grant');
      addLogEntry('Face verified', 'success');
      await fetch(`${APPS_SCRIPT_API}?action=update&type=unlock`);
      setTimeout(resetStatus, 5000);
    } else {
      setStatus("Face not recognized — access denied", 'tone-danger');
      showResult('deny');
      addLogEntry('Face not recognized', 'danger');
      await fetch(`${APPS_SCRIPT_API}?action=update&type=buzzer`);
      setTimeout(resetStatus, 4000);
    }
  }

  function resetStatus() {
    setStatus("Ready — scan your face or fingerprint");
    viewfinder.classList.remove('grant','deny','scanning');
    resultIcon.classList.remove('show');
    if (video.srcObject) scanBtn.disabled = false;
  }
</script>
