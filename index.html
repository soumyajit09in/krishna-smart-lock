<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Face & Fingerprint Lock Pro</title>
  <script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: '-apple-system', BlinkMacSystemFont, sans-serif; 
      text-align: center; background: #0f172a; color: #f8fafc; 
      margin: 0; padding: 0; display: flex; flex-direction: column;
      height: 100vh; width: 100vw; overflow: hidden;
    }
    .app-container { 
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; width: 100%; height: 100%; padding: 25px 20px;
    }
    h2 { color: #38bdf8; margin: 0 0 5px 0; font-size: 26px; font-weight: 800; }
    #status { 
      font-size: 15px; font-weight: 600; color: #94a3b8; padding: 10px 20px; 
      border-radius: 30px; background: #1e293b; border: 1px solid #334155;
      display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-width: 90%; word-wrap: break-word;
    }
    #video-container { 
      position: relative; width: 100%; max-width: 360px; aspect-ratio: 3/4;
      border-radius: 24px; overflow: hidden; background: #020617; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 3px solid #334155;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .footer { width: 100%; max-width: 360px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; }
    .btn { 
      display: block; width: 100%; padding: 16px; font-size: 18px; font-weight: 700; 
      border: none; border-radius: 16px; cursor: pointer; color: white; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    /* Face Button Styling */
    .btn-face { background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .btn-face:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
    /* Fingerprint Button Styling */
    .btn-finger { background: linear-gradient(135deg, #10b981, #047857); }
    
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h2>🔐 AI Smart Lock</h2>
      <div id="status">Starting Cloud AI Engine... 🧠</div>
    </div>
    
    <div id="video-container">
      <video id="webcam" autoplay muted playsinline></video>
    </div>
    
    <div class="footer">
      <!-- Naya Fingerprint Button -->
      <button class="btn btn-finger" id="fingerBtn" onclick="verifyFingerprint()">👆 Use Fingerprint</button>
      
      <!-- Purana Face Verify Button -->
      <button class="btn btn-face" id="scanBtn" onclick="verifyFace()" disabled>📸 Verify My Face</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const scanBtn = document.getElementById('scanBtn');
    const statusDiv = document.getElementById('status');
    
    // NAYA CUSTOMER API URL (Jo aapne deploy kiya)
    const APPS_SCRIPT_API = "https://script.google.com/macros/s/AKfycbxfhuZcbCaPGfQ2LFRNVGWujoZcpB_LizeIWaOiHsi_zgcyjXCeDSFeAlYPjz_vzxbP/exec"; 
    
    let faceMatcher = null;
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/';

    // ==========================================
    // INITIALIZATION & CAMERA
    // ==========================================
    window.onload = async () => {
      try {
        statusDiv.innerText = "Loading AI Brain... ⏳";
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        
        statusDiv.innerText = "Fetching Master Photo... 📂";
        
        let response = await fetch(`${APPS_SCRIPT_API}?action=getMaster`);
        let data = await response.json();
        
        if(data.status === "error") {
          statusDiv.innerText = "Error: Drive file not found! ❌";
          return;
        }
        
        const img = new Image();
        img.src = data.image;
        img.onload = async () => {
          const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
          if (!detection) {
            statusDiv.innerText = "No face in Master Photo! ❌";
            return;
          }
          faceMatcher = new faceapi.FaceMatcher(detection.descriptor, 0.6);
          statusDiv.innerText = "AI Ready! Starting Camera... 📷";
          startCamera();
        };
        
      } catch (err) {
        statusDiv.innerText = "Init Failed: " + err;
      }
    };

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          video.srcObject = stream;
          statusDiv.innerText = "Ready: Scan Face or Finger 😊";
          scanBtn.disabled = false;
        })
        .catch(err => {
          statusDiv.innerText = "Camera access denied! ❌";
        });
    }

    // ==========================================
    // FINGERPRINT LOGIC
    // ==========================================
    async function verifyFingerprint() {
      if (!window.PublicKeyCredential) {
        statusDiv.innerText = "Fingerprint not supported! ❌";
        statusDiv.style.background = "#7f1d1d";
        statusDiv.style.color = "#f87171";
        setTimeout(resetStatus, 3000);
        return;
      }

      statusDiv.innerText = "Scanning Fingerprint... 👆";
      statusDiv.style.background = "#1e293b";
      statusDiv.style.color = "#38bdf8";

      try {
        const challengeArray = new Uint8Array(32);
        window.crypto.getRandomValues(challengeArray);

        const publicKeyCredentialCreationOptions = {
          challenge: challengeArray,
          rp: { name: "AI Face Lock", id: window.location.hostname },
          user: {
            id: Uint8Array.from("user_admin", c => c.charCodeAt(0)),
            name: "admin",
            displayName: "System Admin"
          },
          pubKeyCredParams: [{alg: -7, type: "public-key"}],
          authenticatorSelection: {
            authenticatorAttachment: "platform", // Mobile inbuilt sensor
            userVerification: "required"
          },
          timeout: 60000
        };

        const credential = await navigator.credentials.create({
          publicKey: publicKeyCredentialCreationOptions
        });

        if (credential) {
          statusDiv.style.background = "#064e3b";
          statusDiv.style.color = "#34d399";
          statusDiv.innerText = "🔓 FINGERPRINT ACCEPTED!";
          
          await fetch(`${APPS_SCRIPT_API}?action=update&type=unlock`);
          setTimeout(resetStatus, 5000);
        }
      } catch (error) {
        console.error("Fingerprint Error:", error);
        statusDiv.style.background = "#7f1d1d";
        statusDiv.style.color = "#f87171";
        statusDiv.innerText = "🚨 FINGERPRINT REJECTED/CANCELLED!";
        setTimeout(resetStatus, 4000);
      }
    }

    // ==========================================
    // FACE VERIFY LOGIC
    // ==========================================
    async function verifyFace() {
      scanBtn.disabled = true;
      statusDiv.innerText = "Analyzing Face... 🔍";
      
      const liveDetection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
      if (!liveDetection) {
        statusDiv.innerText = "Face not detected! 👤";
        scanBtn.disabled = false;
        return;
      }
      
      const match = faceMatcher.findBestMatch(liveDetection.descriptor);
      
      if (match.label !== 'unknown') {
        statusDiv.style.background = "#064e3b";
        statusDiv.style.color = "#34d399";
        statusDiv.innerText = "🔓 FACE MATCHED - ACCESS GRANTED!";
        
        await fetch(`${APPS_SCRIPT_API}?action=update&type=unlock`);
        setTimeout(resetStatus, 5000);
      } else {
        statusDiv.style.background = "#7f1d1d";
        statusDiv.style.color = "#f87171";
        statusDiv.innerText = "🚨 FACE DENIED!";
        
        await fetch(`${APPS_SCRIPT_API}?action=update&type=buzzer`);
        setTimeout(resetStatus, 4000);
      }
    }

    function resetStatus() {
      statusDiv.style.background = "#1e293b";
      statusDiv.style.color = "#f8fafc";
      statusDiv.innerText = "Ready: Scan Face or Finger 😊";
      if(video.srcObject) scanBtn.disabled = false;
    }
  </script>
</body>
</html>
